services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reviewpilot
      POSTGRES_USER: reviewpilot
      POSTGRES_PASSWORD: local-reviewpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewpilot -d reviewpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  agents:
    build:
      context: ./apps/agents
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://reviewpilot:local-reviewpilot@database:5432/reviewpilot
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy

  worker:
    build:
      context: ./apps/agents
    working_dir: /app
    command: python -m app.worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://reviewpilot:local-reviewpilot@database:5432/reviewpilot
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AGENTS_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    depends_on:
      - agents

volumes:
  redis-data:
  postgres-data:
