databases:
  - name: reviewpilot-db
    plan: basic-256mb

services:
  - type: keyvalue
    name: reviewpilot-queue
    plan: starter
    maxmemoryPolicy: noeviction

  - type: web
    name: reviewpilot-agents
    runtime: python
    rootDir: apps/agents
    plan: starter
    buildCommand: "python -m pip install --only-binary=:all: -r requirements-lock.txt"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: GITHUB_API_URL
        value: https://api.github.com
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reviewpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reviewpilot-queue
          type: keyvalue
          property: connectionString

  - type: worker
    name: reviewpilot-webhook-worker
    runtime: python
    rootDir: apps/agents
    plan: starter
    buildCommand: "python -m pip install --only-binary=:all: -r requirements-lock.txt"
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_API_URL
        value: https://api.github.com
      - key: DATABASE_URL
        fromDatabase:
          name: reviewpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reviewpilot-queue
          type: keyvalue
          property: connectionString
